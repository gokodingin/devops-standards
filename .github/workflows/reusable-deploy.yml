name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment target (development, staging, production)'
        required: true
        type: string
      domain:
        description: 'Domain publik aplikasi (misal: api.gokodingin.com)'
        required: true
        type: string
      container_name:
        description: 'Nama container aplikasi di docker-compose'
        required: true
        type: string
      port:
        description: 'Port internal container aplikasi (misal: 3000 atau 80)'
        required: false
        type: number
        default: 80
      db_type:
        description: 'Tipe shared DB yang dicek: postgres | mariadb | none'
        required: false
        type: string
        default: 'postgres'
      db_name:
        description: 'Nama database yang akan dipastikan ada (opsional)'
        required: false
        type: string
        default: '-'
      compose_file:
        description: 'File compose yang digunakan (misal: docker-compose.yml atau docker-compose.staging.yml)'
        required: false
        type: string
        default: 'docker-compose.yml'
    secrets:
      TAILSCALE_AUTHKEY:
        description: 'Tailscale Ephemeral Auth Key untuk menghubungkan GitHub Runner ke Tailnet'
        required: true
      SERVER_HOST:
        description: 'Tailscale IP server target (misal: 100.101.0.48)'
        required: true
      SERVER_USER:
        description: 'User SSH server (deploy / gokodingin)'
        required: true
      SSH_PRIVATE_KEY:
        description: 'Private SSH Key untuk login ke server'
        required: true
      SSH_KNOWN_HOSTS:
        description: 'Pinned SSH host key server target untuk mencegah MITM'
        required: false
      APP_ENV:
        description: 'Isi lengkap file .env untuk aplikasi (dienkripsi di GitHub Secrets)'
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - name: Connect GitHub Runner to Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3 pinned
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Deploy via Tailscale SSH (Immutable SHA & Secure Payload)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          APP_ENV: ${{ secrets.APP_ENV }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
          COMPOSE: ${{ inputs.compose_file }}
          DOMAIN: ${{ inputs.domain }}
          CTR: ${{ inputs.container_name }}
          PORT: ${{ inputs.port }}
          DBT: ${{ inputs.db_type }}
          DBN: ${{ inputs.db_name }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            STRICT_HOST_KEY="yes"
          else
            STRICT_HOST_KEY="accept-new"
          fi

          echo "Mengirim perintah deploy untuk commit $SHA..."
          printf '%s' "$APP_ENV" | ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking="$STRICT_HOST_KEY" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "${USER}@${HOST}" "deploy $REPO $SHA $COMPOSE $DOMAIN $CTR $PORT $DBT $DBN"

          shred -u ~/.ssh/id_deploy || rm -f ~/.ssh/id_deploy
