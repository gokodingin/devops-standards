name: Reusable Deploy & Auto-Register NPM

on:
  workflow_call:
    inputs:
      domain:
        description: 'Domain publik aplikasi (misal: api.gokodingin.com)'
        required: true
        type: string
      container_name:
        description: 'Nama container aplikasi di docker-compose'
        required: true
        type: string
      port:
        description: 'Port internal container aplikasi (misal: 3000 atau 80)'
        required: false
        type: number
        default: 80
      db_type:
        description: 'Tipe shared DB yang dicek: postgres | mariadb | none'
        required: false
        type: string
        default: 'postgres'
      db_name:
        description: 'Nama database yang akan dipastikan ada (opsional)'
        required: false
        type: string
        default: ''
    secrets:
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      NPM_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy & Provision via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          NPM_PASSWORD: ${{ secrets.NPM_PASSWORD }}
          DOMAIN: ${{ inputs.domain }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          PORT: ${{ inputs.port }}
          DB_TYPE: ${{ inputs.db_type }}
          DB_NAME: ${{ inputs.db_name }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NPM_PASSWORD,DOMAIN,CONTAINER_NAME,PORT,DB_TYPE,DB_NAME,REPO_NAME
          script: |
            set -e
            echo "=== [1/3] Menyiapkan Direktori & Kode Aplikasi ==="
            PROJECT_DIR="/home/gokodingin/$REPO_NAME"
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Folder $PROJECT_DIR belum ada di server, silakan clone terlebih dahulu."
              exit 1
            fi
            cd "$PROJECT_DIR"
            git pull origin main || git pull origin master

            echo "=== [2/3] Memeriksa Shared Database ==="
            COMPOSE_PROFILE=""
            if [ "$DB_TYPE" = "postgres" ]; then
              if docker ps --format '{{.Names}}' | grep -q "^DB_POSTGRE$"; then
                echo "[DB] Shared PostgreSQL terdeteksi aktif."
                if [ -n "$DB_NAME" ]; then
                  docker exec DB_POSTGRE psql -U gokodingin -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" | grep -q 1 || \
                  docker exec DB_POSTGRE psql -U gokodingin -d postgres -c "CREATE DATABASE $DB_NAME;"
                  echo "[DB] Database $DB_NAME siap."
                fi
              else
                echo "[DB] DB_POSTGRE tidak aktif, mengaktifkan local fallback..."
                COMPOSE_PROFILE="--profile local-db"
              fi
            elif [ "$DB_TYPE" = "mariadb" ] || [ "$DB_TYPE" = "mysql" ]; then
              if docker ps --format '{{.Names}}' | grep -q "^mariadb_server$"; then
                echo "[DB] Shared MariaDB terdeteksi aktif."
                if [ -n "$DB_NAME" ]; then
                  docker exec mariadb_server mysql -u root -e "CREATE DATABASE IF NOT EXISTS $DB_NAME;"
                  echo "[DB] Database $DB_NAME siap."
                fi
              fi
            fi

            echo "=== [3/3] Menjalankan Container & Sinkronisasi NPM ==="
            docker compose $COMPOSE_PROFILE up -d --build

            # Panggil binary global sync-npm-proxy yang terinstall di /usr/local/bin
            sync-npm-proxy "$DOMAIN" "$CONTAINER_NAME" "$PORT"
