name: Reusable Deploy & Auto-Register NPM

on:
  workflow_call:
    inputs:
      domain:
        description: 'Domain publik aplikasi (misal: api.gokodingin.com)'
        required: true
        type: string
      container_name:
        description: 'Nama container aplikasi di docker-compose'
        required: true
        type: string
      port:
        description: 'Port internal container aplikasi (misal: 3000 atau 80)'
        required: false
        type: number
        default: 80
      db_type:
        description: 'Tipe shared DB yang dicek: postgres | mariadb | none'
        required: false
        type: string
        default: 'postgres'
      db_name:
        description: 'Nama database yang akan dipastikan ada (opsional)'
        required: false
        type: string
        default: ''
      compose_file:
        description: 'File compose yang digunakan (misal: docker-compose.yml atau docker-compose.staging.yml)'
        required: false
        type: string
        default: 'docker-compose.yml'
    secrets:
      TAILSCALE_AUTHKEY:
        description: 'Tailscale Ephemeral Auth Key untuk menghubungkan GitHub Runner ke Tailnet'
        required: true
      SERVER_HOST:
        description: 'Tailscale IP server target (misal: 100.101.0.48)'
        required: true
      SERVER_USER:
        description: 'User SSH server (root / gokodingin)'
        required: true
      SSH_PRIVATE_KEY:
        description: 'Private SSH Key untuk login ke server'
        required: true
      NPM_PASSWORD:
        description: 'Password login NPM API'
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect GitHub Runner to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Deploy & Provision via Tailscale SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          NPM_PASSWORD: ${{ secrets.NPM_PASSWORD }}
          DOMAIN: ${{ inputs.domain }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          PORT: ${{ inputs.port }}
          DB_TYPE: ${{ inputs.db_type }}
          DB_NAME: ${{ inputs.db_name }}
          COMPOSE_FILE: ${{ inputs.compose_file }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NPM_PASSWORD,DOMAIN,CONTAINER_NAME,PORT,DB_TYPE,DB_NAME,COMPOSE_FILE,REPO_NAME
          script: |
            set -e
            git config --global --add safe.directory '*' || true
            echo "=== [1/3] Menyiapkan Direktori & Kode Aplikasi ==="
            PROJECT_DIR="/home/gokodingin/$REPO_NAME"
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Folder $PROJECT_DIR belum memiliki git repo. Meng-clone dari GitHub..."
              mkdir -p "/home/gokodingin"
              if [ -d "$PROJECT_DIR" ]; then
                cd "$PROJECT_DIR"
                git init
                git remote add origin "git@github.com:${{ github.repository }}.git" || true
                git fetch origin
                git checkout -f "${{ github.ref_name }}" || git checkout -b "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
              else
                git clone "git@github.com:${{ github.repository }}.git" "$PROJECT_DIR"
                cd "$PROJECT_DIR"
                git checkout "${{ github.ref_name }}"
              fi
            else
              cd "$PROJECT_DIR"
              git fetch origin
              git checkout "${{ github.ref_name }}"
              git pull origin "${{ github.ref_name }}"
            fi
            echo "=== [2/3] Memeriksa Shared Database ==="
            COMPOSE_PROFILE=""
            if [ "$DB_TYPE" = "postgres" ]; then
              if docker ps --format '{{.Names}}' | grep -q "^DB_POSTGRE$"; then
                echo "[DB] Shared PostgreSQL terdeteksi aktif."
                if [ -n "$DB_NAME" ]; then
                  docker exec DB_POSTGRE psql -U gokodingin -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" | grep -q 1 || \
                  docker exec DB_POSTGRE psql -U gokodingin -d postgres -c "CREATE DATABASE $DB_NAME;"
                  echo "[DB] Database $DB_NAME siap."
                fi
              else
                echo "[DB] DB_POSTGRE tidak aktif, mengaktifkan local fallback..."
                COMPOSE_PROFILE="--profile local-db"
              fi
            elif [ "$DB_TYPE" = "mariadb" ] || [ "$DB_TYPE" = "mysql" ]; then
              if docker ps --format '{{.Names}}' | grep -q "^mariadb_server$"; then
                echo "[DB] Shared MariaDB terdeteksi aktif."
                if [ -n "$DB_NAME" ]; then
                  docker exec mariadb_server mysql -u root -e "CREATE DATABASE IF NOT EXISTS $DB_NAME;"
                  echo "[DB] Database $DB_NAME siap."
                fi
              fi
            fi

            echo "=== [3/3] Menjalankan Container & Sinkronisasi NPM ==="
            # Gunakan nama project turunan dari compose_file (misal home-storage-staging / home-storage-prod)
            CLEAN_ENV=$(echo "$COMPOSE_FILE" | sed -E 's/docker-compose\.?//; s/\.ya?ml//; s/^\.//')
            if [ -z "$CLEAN_ENV" ] || [ "$CLEAN_ENV" = "yml" ] || [ "$CLEAN_ENV" = "yaml" ]; then
              PROJECT_ENV_NAME="${REPO_NAME}-prod"
            else
              PROJECT_ENV_NAME="${REPO_NAME}-${CLEAN_ENV}"
            fi
            docker compose -p "$PROJECT_ENV_NAME" -f "$COMPOSE_FILE" $COMPOSE_PROFILE up -d --build
            # Panggil binary global sync-npm-proxy yang terinstall di /usr/local/bin
            sync-npm-proxy "$DOMAIN" "$CONTAINER_NAME" "$PORT"
