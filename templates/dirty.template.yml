name: CI - Dirty Branch (Automated Tests Only)

on:
  push:
    branches:
      - dirty
      - 'dirty/*'
  pull_request:
    branches:
      - dirty

jobs:
  integration-test:
    name: 🧪 Automated Test for Dirty Branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            storage-api/package.json
            storage-app/package.json

      - name: Backend Test
        run: |
          if [ -d "storage-api" ]; then
            cd storage-api
            npm ci || npm install
            if npm run | grep -q "test"; then npm test; fi
            cd ..
          fi

      - name: Frontend Build Verification
        run: |
          if [ -d "storage-app" ]; then
            cd storage-app
            npm ci || npm install
            if npm run | grep -q "test"; then npm test; fi
            npm run build
            cd ..
          fi

      - name: Verify Compose Syntax
        run: |
          docker compose -f docker-compose.dev.yml config > /dev/null
          docker compose -f docker-compose.staging.yml config > /dev/null
          docker compose -f docker-compose.yml config > /dev/null
          echo "All compose files are syntactically valid."
