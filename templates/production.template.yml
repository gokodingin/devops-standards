name: Test & Production Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # --------------------------------------------------------------------------
  # 1. INTEGRATION TEST KETAT UNTUK PRODUCTION
  # --------------------------------------------------------------------------
  integration-test:
    name: 🧪 Rigorous Integration Test & Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            storage-api/package.json
            storage-app/package.json

      - name: Backend Test
        run: |
          if [ -d "storage-api" ]; then
            cd storage-api
            npm ci || npm install
            if npm run | grep -q "test"; then npm test; fi
            cd ..
          fi

      - name: Frontend Build Verification
        run: |
          if [ -d "storage-app" ]; then
            cd storage-app
            npm ci || npm install
            if npm run | grep -q "test"; then npm test; fi
            npm run build
            cd ..
          fi

      - name: Verify Compose Syntax
        run: |
          docker compose -f docker-compose.yml config > /dev/null

  # --------------------------------------------------------------------------
  # 2. DEPLOY KE SERVER PRODUCTION (Hanya saat Push/Merge, bukan saat PR)
  # --------------------------------------------------------------------------
  deploy-production:
    name: 🛡️ Deploy to Production Server
    needs: integration-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    uses: gokodingin/devops-standards/.github/workflows/reusable-deploy.yml@main
    secrets: inherit
    with:
      domain: "storage.gokodingin.com"
      container_name: "home_storage_nginx"
      port: 80
      db_type: "postgres"
      db_name: "home_storage"
      compose_file: "docker-compose.yml"
