name: CI/CD - Development Server

on:
  push:
    branches:
      - development
      - develop
  pull_request:
    branches:
      - development
      - develop

jobs:
  # --------------------------------------------------------------------------
  # 1. INTEGRATION TEST
  # --------------------------------------------------------------------------
  integration-test:
    name: 🧪 Automated Test for Development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            storage-api/package.json
            storage-app/package.json

      - name: Backend Test
        run: |
          if [ -d "storage-api" ]; then
            cd storage-api
            npm ci || npm install
            if npm run | grep -q "test"; then npm test; fi
            cd ..
          fi

      - name: Frontend Build Verification
        run: |
          if [ -d "storage-app" ]; then
            cd storage-app
            npm ci || npm install
            if npm run | grep -q "test"; then npm test; fi
            npm run build
            cd ..
          fi

      - name: Verify Compose Syntax
        run: |
          docker compose -f docker-compose.dev.yml config > /dev/null

  # --------------------------------------------------------------------------
  # 2. DEPLOY KE SERVER DEVELOPMENT
  # --------------------------------------------------------------------------
  deploy-development:
    name: 🧪 Deploy to Development Server
    needs: integration-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/develop')
    uses: gokodingin/devops-standards/.github/workflows/reusable-deploy.yml@main
    secrets: inherit
    with:
      domain: "storage-dev.gokodingin.com"
      container_name: "home_storage_nginx_dev"
      port: 80
      db_type: "postgres"
      db_name: "home_storage_dev"
      compose_file: "docker-compose.dev.yml"
