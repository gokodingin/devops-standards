services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ${CONTAINER_NAME:?CONTAINER_NAME wajib diisi}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL wajib diisi via secret}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET wajib diisi via secret}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - shared_network

  # Database fallback hanya aktif di dev lokal (docker compose --profile local-db up -d)
  db:
    image: postgres:15-alpine
    profiles:
      - local-db
    environment:
      - POSTGRES_USER=${LOCAL_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${LOCAL_DEV_AUTH:-postgres}
      - POSTGRES_DB=${LOCAL_DB_NAME:-myapp_dev}
    networks:
      - shared_network

networks:
  shared_network:
    external: true
