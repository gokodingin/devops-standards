version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ${CONTAINER_NAME:-myapp_prod}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://gokodingin:***REMOVED***@DB_POSTGRE:5432/myapp_prod}
    networks:
      - shared_network

  # Database fallback hanya aktif di dev lokal (docker compose --profile local-db up -d)
  db:
    image: postgres:15-alpine
    profiles:
      - local-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=myapp_prod
    networks:
      - shared_network

networks:
  shared_network:
    external: true
