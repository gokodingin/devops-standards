name: CD - Deploy Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  test-gate:
    name: 🧪 Quality Gatekeeper
    uses: gokodingin/devops-standards/.github/workflows/reusable-test.yml@main

  deploy:
    name: 🚀 Deploy to Staging Server
    needs: test-gate
    uses: gokodingin/devops-standards/.github/workflows/reusable-deploy.yml@main
    secrets:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      APP_ENV: ${{ secrets.APP_ENV }}
    with:
      environment: "staging"
      domain: "storage-staging.gokodingin.com"
      container_name: "home_storage_nginx_staging"
      port: 80
      db_type: "postgres"
      db_name: "home_storage_staging"
      compose_file: "docker-compose.staging.yml"
