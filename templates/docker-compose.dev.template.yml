services:
  # ── Node.js Backend (Dev Server) ─────────────────────────────
  backend_dev:
    build:
      context: ./storage-api
      dockerfile: Dockerfile
      target: development       # Stage dev: runtime + hot-reload + dev tools
    container_name: home_storage_backend_dev
    user: "node"
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL wajib diisi (jalankan scripts/gen-dev-env.sh)}
      STORAGE_ROOT: /var/storage
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi (jalankan scripts/gen-dev-env.sh)}
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - ./storage_dev:/var/storage
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "3000"

  # ── React Frontend (Dev Server) ──────────────────────────────
  frontend_dev:
    build:
      context: ./storage-app
      dockerfile: Dockerfile
      target: builder
      args:
        VITE_API_URL: /api
        MODE: development
    container_name: home_storage_frontend_dev
    restart: unless-stopped
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    expose:
      - "80"

  # ── Nginx Reverse Proxy (Dev Server) ─────────────────────────
  nginx_dev:
    build:
      context: ./nginx
      dockerfile: Dockerfile.staging
    container_name: home_storage_nginx_dev
    restart: unless-stopped
    depends_on:
      backend_dev:
        condition: service_healthy
      frontend_dev:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - ./storage_dev:/var/storage:ro
    networks:
      - shared_network

networks:
  shared_network:
    external: true
